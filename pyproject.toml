[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biovoid"
version = "0.1.0"
description = "Local research prototype for geometry and motion-aware protein pocket analysis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12,<3.14"
authors = [{name = "Bio-Void Hunter Team"}]

dependencies = [
    "biopython>=1.87",
    "biotite>=1.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "pandas>=2.0",
    "plotly>=5.15",
    "requests>=2.34.2",
    "tqdm>=4.65",
    "fastapi>=0.141.1",
    "starlette>=1.3.1",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
docking = ["meeko>=0.5"]
dev = [
    "pytest>=9.1.1",
    # Starlette 1.3.1's TestClient uses this client; keep it aligned with the lock.
    "httpx2>=2.9.1",
    "ruff>=0.4",
    "pre-commit>=3.0",
    "mypy>=1.19",
    "pip-audit>=2.9",
    "coverage>=7.10",
]

[project.scripts]
biovoid = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "src/api/portal.py",
]

[tool.ruff.lint]
select = ["E", "F"]
ignore = [
    "E402",
    "E501",
    "E741",
    "F401",
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short -m 'not integration and not scientific and not performance and not e2e and not private'"
markers = [
    "integration: opt-in tests that may use network or real local structure data",
    "scientific: opt-in scientific invariant and validation tests",
    "performance: opt-in wall-clock and peak-memory benchmarks",
    "e2e: opt-in browser or full-stack end-to-end tests",
    "private: local research checks that require ignored evidence or evaluator locks",
]

[tool.coverage.run]
# Keep the release gate focused on importable package code, not root tooling.
source = ["src"]

[tool.mypy]
ignore_missing_imports = true
