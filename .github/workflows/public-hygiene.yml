name: public-hygiene

on:
  workflow_dispatch:
  push:
    branches: [main, "ws-main/*"]
  pull_request:
    branches: [main]

jobs:
  source-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check source-only boundary
        run: python scripts/check_public_hygiene.py --history --history-ref HEAD
