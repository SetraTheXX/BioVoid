name: phase6-contract-guard

on:
  workflow_dispatch:
  push:
    paths:
      - "src/api/**"
      - "src/benchmark_v1.py"
      - "src/evaluator_format.py"
      - "tests/test_phase6_ops.py"
      - "tests/test_phase6_api.py"
      - "tests/test_phase6_portal.py"
      - "tests/test_recovery_phase6_readiness.py"
  pull_request:
    paths:
      - "src/api/**"
      - "src/benchmark_v1.py"
      - "src/evaluator_format.py"
      - "tests/test_phase6_ops.py"
      - "tests/test_phase6_api.py"
      - "tests/test_phase6_portal.py"
      - "tests/test_recovery_phase6_readiness.py"

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r requirements-lock.txt

      - name: Run hermetic Phase 6 contract guard
        run: >-
          python -m pytest
          tests/test_phase6_ops.py
          tests/test_phase6_api.py
          tests/test_phase6_portal.py
          tests/test_recovery_phase6_readiness.py
          -q --tb=short
