name: phase6-contract-guard

on:
  workflow_dispatch:
  push:
    paths:
      - "src/api/**"
      - "src/benchmark_v1.py"
      - "src/evaluator_format.py"
      - "tests/test_phase6_ops.py"
      - "tests/test_phase6_api.py"
      - "tests/test_phase6_portal.py"
      - "tests/test_recovery_phase6_readiness.py"
  pull_request:
    paths:
      - "src/api/**"
      - "src/benchmark_v1.py"
      - "src/evaluator_format.py"
      - "tests/test_phase6_ops.py"
      - "tests/test_phase6_api.py"
      - "tests/test_phase6_portal.py"
      - "tests/test_recovery_phase6_readiness.py"

jobs:
  contract-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install deps
        run: pip install -r requirements-lock.txt

      - name: Run hermetic Phase 6 contract guard
        run: >-
          python -m pytest
          tests/test_phase6_ops.py
          tests/test_phase6_api.py
          tests/test_phase6_portal.py
          tests/test_recovery_phase6_readiness.py
          -q --tb=short
